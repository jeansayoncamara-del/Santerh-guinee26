# Construit l'APK Android de SantéRH (pointage automatique des agents)
# à partir de SanteRH-Guinee.html, sur les serveurs de GitHub.
# L'APK est publié dans « Releases » du dépôt.
name: Construire l'APK SantéRH

on:
  workflow_dispatch:
  push:
    paths:
      - 'SanteRH-Guinee.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Préparer le projet Capacitor
        run: |
          test -f SanteRH-Guinee.html || { echo "::error::SanteRH-Guinee.html introuvable à la racine du dépôt"; exit 1; }
          mkdir -p app/www
          for f in *; do [ "$f" != "app" ] && cp -r "$f" app/www/; done
          cp SanteRH-Guinee.html app/www/index.html
          cd app
          echo '{"name":"santerh-agent","version":"1.0.0","private":true}' > package.json
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor-community/background-geolocation@^1.2.26
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.santerhguinee.agent",
            "appName": "SantéRH",
            "webDir": "www",
            "android": { "useLegacyBridge": true }
          }
          JSON
          npx cap add android

      - name: Permissions Android (localisation, service, notifications)
        working-directory: app
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['INTERNET', 'ACCESS_COARSE_LOCATION', 'ACCESS_FINE_LOCATION', 'FOREGROUND_SERVICE',
                   'FOREGROUND_SERVICE_LOCATION', 'POST_NOTIFICATIONS', 'CAMERA']
          ajout = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x
                          for x in perms if 'android.permission.%s"' % x not in s)
          ajout += '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n'
          ajout += '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          s = s.replace('</manifest>', ajout + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          npx cap sync android

      - name: Signature fixe et numéro de version
        working-directory: app/android
        run: |
          echo "" | base64 -d > app/santerh-agent.keystore
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('santerh-agent.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE

      - name: Construire l'APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../SanteRH-agent.apk

      - name: Publier l'APK (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SantéRH — APK n° ${{ github.run_number }}
          body: APK de SantéRH avec pointage automatique des agents. Téléchargez SanteRH-agent.apk ci-dessous.
          files: SanteRH-agent.apk
